<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="login-container">
  <div class="login-form">
    <div class="login-header">
      <h2>Gym Login</h2>
      <div class="logo">
        <svg viewBox="0 0 24 24" width="48" height="48">
          <path fill="#00B07B" d="M20.57 14.86L22 13.43 20.57 12 17 15.57 8.43 7 12 3.43 10.57 2 9.14 3.43 7.71 2 5.57 4.14 4.14 2.71 2.71 4.14 4.14 5.57 2 7.71 3.43 9.14 2 10.57 3.43 12 7 8.43 15.57 17 12 20.57 13.43 22 14.86 20.57 16.29 22 18.43 19.86 19.86 18.43 18.43 19.86 16.29 22 14.86 20.57z"/>
        </svg>
      </div>
    </div>
    <div class="form-group">
      <label for="username">Username</label>
      <input type="text" id="username" placeholder="Enter your username">
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" placeholder="Enter your password">
    </div>
    <button id="login-button">Login</button>
    <div class="reset-password">
      <a href="#" id="reset-link">Forgot password?</a>
    </div>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>
